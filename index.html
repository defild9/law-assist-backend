<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Stand</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .chat-container {
        width: 100%;
        max-width: 600px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background-color: #f7f7f7;
      }
      .message {
        margin-bottom: 15px;
        display: flex;
      }
      .message.user {
        justify-content: flex-end;
      }
      .message.assistant {
        justify-content: flex-start;
      }
      .bubble {
        max-width: 70%;
        padding: 10px 15px;
        border-radius: 20px;
        font-size: 14px;
        line-height: 1.4;
      }
      .message.user .bubble {
        background-color: #dcf8c6;
        color: #000;
        border-bottom-right-radius: 0;
      }
      .message.assistant .bubble {
        background-color: #ececec;
        color: #000;
        border-bottom-left-radius: 0;
      }
      .input-area {
        display: flex;
        border-top: 1px solid #ddd;
      }
      .input-area input[type='text'] {
        flex: 1;
        padding: 15px;
        border: none;
        outline: none;
        font-size: 16px;
      }
      .input-area button {
        padding: 15px 20px;
        border: none;
        background-color: #4caf50;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }
      .input-area button:disabled {
        background-color: #cccccc;
      }
      #chatIdInfo {
        padding: 10px;
        text-align: center;
        font-size: 13px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <input
          type="text"
          id="prompt"
          placeholder="Enter a message..."
          autocomplete="off"
        />
        <button id="submitBtn">Send</button>
      </div>
      <div id="chatIdInfo"></div>
    </div>

    <script>
      let currentChatId = localStorage.getItem('currentChatId');
      const chatIdInfo = document.getElementById('chatIdInfo');
      const updateChatInfo = () => {
        chatIdInfo.innerHTML = currentChatId
          ? `Current Chat ID: <code>${currentChatId}</code>`
          : 'New chat session';
      };
      updateChatInfo();

      let abortController = null;
      const messagesContainer = document.getElementById('messages');
      const promptInput = document.getElementById('prompt');
      const submitBtn = document.getElementById('submitBtn');

      function appendMessage(role, text) {
        const messageEl = document.createElement('div');
        messageEl.classList.add('message', role);
        const bubble = document.createElement('div');
        bubble.classList.add('bubble');
        bubble.textContent = text;
        messageEl.appendChild(bubble);
        messagesContainer.appendChild(messageEl);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      async function sendMessage() {
        const prompt = promptInput.value.trim();
        if (!prompt) {
          alert('Please enter a message');
          return;
        }
        appendMessage('user', prompt);
        promptInput.value = '';
        submitBtn.disabled = true;

        if (abortController) {
          abortController.abort();
        }
        abortController = new AbortController();

        try {
          const response = await fetch(
            'http://localhost:4000/api/conversation',
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFpbCI6InVzZXIxQGV4YW1wbGUuY29tIiwic3ViIjoiNjdiZjA2NGU1OTc3Mjc5ZjY1MjVjMjRmIiwicm9sZSI6InVzZXIiLCJpYXQiOjE3NDA1NzU5ODgsImV4cCI6MTc0MzE2Nzk4OH0.Co1lYlWjuKWehDuLOfthG_I7n0Jn2RpD_oXmedrj-to`,
              },
              body: JSON.stringify({
                prompt,
                chatId: currentChatId,
              }),
              signal: abortController.signal,
            },
          );

          if (!response.ok) {
            throw new Error(`Error: ${response.status}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          let assistantBubble = null;

          assistantBubble = document.createElement('div');
          assistantBubble.classList.add('message', 'assistant');
          const bubbleContent = document.createElement('div');
          bubbleContent.classList.add('bubble');
          assistantBubble.appendChild(bubbleContent);
          messagesContainer.appendChild(assistantBubble);
          messagesContainer.scrollTop = messagesContainer.scrollHeight;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            let parts = buffer.split('\n\n');

            parts.slice(0, -1).forEach((part) => {
              if (part.startsWith('data:')) {
                const data = part.replace(/^data:\s?/, '');
                try {
                  const parsed = JSON.parse(data);

                  if (parsed.chatId) {
                    currentChatId = parsed.chatId;
                    localStorage.setItem('currentChatId', currentChatId);
                    updateChatInfo();
                  }

                  if (parsed.content) {
                    bubbleContent.textContent += parsed.content;
                    messagesContainer.scrollTop =
                      messagesContainer.scrollHeight;
                  }
                } catch (e) {
                  bubbleContent.textContent += data;
                }
              }
            });

            buffer = parts[parts.length - 1];
          }
        } catch (error) {
          appendMessage('assistant', `Error: ${error.message}`);
        } finally {
          submitBtn.disabled = false;
          abortController = null;
        }
      }

      submitBtn.addEventListener('click', sendMessage);
      promptInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          sendMessage();
        }
      });
    </script>
  </body>
</html>
